<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Label, bake, serve · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F8FAFC;
      --color-ink:     #0F172A;
      --color-muted:   #475569;
      --color-accent:  #FF6900;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.625rem;
    }

    .caption {
      font-size: 0.875rem;
      color: var(--color-muted);
      max-width: 40rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 780px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Vambe Dashboard</p>
    <h1>Label, bake, serve</h1>
    <p class="caption">Labeling runs once, offline. The live app only reads a pre-baked SQLite file — no API key and no LLM call at request time.</p>

    <svg viewBox="0 0 920 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
      <title id="how-it-works-title">Label, bake, serve</title>
      <desc id="how-it-works-desc">A CSV of 10,000 sales-meeting transcripts feeds an offline LLM labeling step and is baked, together with the resulting labels, into a SQLite database; the live dashboard only ever reads that pre-baked database.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FF6900"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#437AEF"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F8FAFC"/>

      <!-- Arrows (behind nodes) -->
      <!-- CSV -> LLM: same x, straight vertical -->
      <line x1="120" y1="112" x2="120" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- CSV -> SQLite: right+down elbow, enters upper attach point -->
      <path d="M 200,76 H 252 Q 260,76 260,84 V 104 Q 260,112 268,112 H 320"
            fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- LLM -> SQLite: right+up elbow, enters lower attach point -->
      <path d="M 200,228 H 252 Q 260,228 260,220 V 200 Q 260,192 268,192 H 320"
            fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- SQLite -> Dashboard: same y, straight horizontal, accent (focal-out) -->
      <line x1="520" y1="152" x2="680" y2="152" stroke="#FF6900" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels (masked) -->
      <rect x="230" y="84" width="42" height="12" rx="2" fill="#F8FAFC"/>
      <text x="251" y="93" fill="#64748B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INGEST</text>

      <rect x="228" y="204" width="46" height="12" rx="2" fill="#F8FAFC"/>
      <text x="251" y="213" fill="#64748B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LABELS</text>

      <rect x="562" y="140" width="76" height="12" rx="2" fill="#F8FAFC"/>
      <text x="600" y="149" fill="#FF6900" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text>

      <!-- CSV (input) -->
      <rect x="40" y="40" width="160" height="72" rx="6" fill="#F8FAFC"/>
      <rect x="40" y="40" width="160" height="72" rx="6" fill="rgba(71,85,105,0.10)" stroke="#64748B" stroke-width="1"/>
      <rect x="48" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(100,116,139,0.40)" stroke-width="0.8"/>
      <text x="62" y="57" fill="#64748B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CSV</text>
      <text x="120" y="80" fill="#0F172A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">10,000 transcripts</text>
      <text x="120" y="96" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Spanish · sales meetings</text>

      <!-- LLM (offline, optional/async style) -->
      <rect x="40" y="192" width="160" height="72" rx="6" fill="#F8FAFC"/>
      <rect x="40" y="192" width="160" height="72" rx="6" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="48" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.20)" stroke-width="0.8"/>
      <text x="62" y="209" fill="#64748B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="120" y="232" fill="#0F172A" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Offline labeling</text>
      <text x="120" y="248" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenRouter · Gemma</text>

      <!-- SQLite (focal store) -->
      <rect x="320" y="72" width="200" height="160" rx="6" fill="#F8FAFC"/>
      <rect x="320" y="72" width="200" height="160" rx="6" fill="rgba(255,105,0,0.08)" stroke="#FF6900" stroke-width="1"/>
      <rect x="332" y="88" width="24" height="12" rx="2" fill="transparent" stroke="rgba(255,105,0,0.50)" stroke-width="0.8"/>
      <text x="344" y="97" fill="#FF6900" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="420" y="146" fill="#0F172A" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite</text>
      <text x="420" y="162" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">baked database</text>
      <text x="420" y="176" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">meetings.db</text>

      <!-- Dashboard (serve) -->
      <rect x="680" y="108" width="200" height="88" rx="6" fill="#F8FAFC"/>
      <rect x="680" y="108" width="200" height="88" rx="6" fill="#ffffff" stroke="#0F172A" stroke-width="1"/>
      <rect x="692" y="124" width="28" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
      <text x="706" y="133" fill="#0F172A" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="780" y="156" fill="#0F172A" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dashboard</text>
      <text x="780" y="172" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI + React</text>
      <text x="780" y="186" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apps/api · apps/web</text>
    </svg>
  </div>
</body>
</html>
